version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.20  # Node.js with npm/yarn
    working_directory: ~/project

jobs:
  install-deps:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            npm ci
            npx playwright install --with-deps

  run-tests:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            npm ci
            npx playwright install --with-deps
      - run:
          name: Run Playwright tests with Allure reporter
          command: |
            npm run test:master --reporter=line,allure-playwright
      - run:
          name: Generate Allure HTML report
          command: |
            npx allure generate ./allure-results --clean -o ./allure-report
      - store_artifacts:
          path: ./allure-report
          destination: allure-report
      - store_test_results:
          path: ./allure-results

workflows:
  version: 2
  test-and-report:
    jobs:
      - install-deps
      - run-tests:
          requires:
            - install-deps
